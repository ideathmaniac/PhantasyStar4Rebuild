// Android build of the free (interpreter) version: SDL2 from source
// (cloned into jni/SDL by the CI workflow or by hand, see android/README.md)
// plus the same front end as on Windows and Linux (win/main.c over port/).
plugins { id 'com.android.application' }

android {
    namespace 'com.ps4recomp'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ps4recomp.game'
        minSdk 21
        targetSdk 34
        versionCode 41
        versionName '0.41'
        externalNativeBuild { ndkBuild { arguments 'APP_PLATFORM=android-21' } }
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    externalNativeBuild { ndkBuild { path 'jni/Android.mk' } }
    sourceSets { main { java.srcDirs = ['src/main/java', 'jni/SDL/android-project/app/src/main/java'] } }
    // A fixed key (secrets ANDROID_KEYSTORE / ANDROID_KEY_PASSWORD, decoded
    // by the workflow) lets a new APK install over the old one, keeping the
    // saves. Without it the build is signed with a throwaway debug key.
    def ks = System.getenv('ANDROID_KEYSTORE_FILE')
    signingConfigs {
        fixed {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEY_PASSWORD')
                keyAlias 'ps4'
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.fixed : signingConfigs.debug   // installable as is; not for an app store
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

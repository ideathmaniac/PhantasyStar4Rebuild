# Free builds (interpreter only, nothing from the game inside): the Android
# APK and the Linux / Steam Deck program. The recompiled builds need the ROM
# and are made locally (build_win.sh, build_linux.sh).
name: builds
on:
  push:
    paths: ['src/**', 'win/**', 'port/**', 'android/**', 'third_party/**', 'tools/**', 'build_linux.sh', '.github/workflows/builds.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: SDL2 source
        run: git clone --depth 1 -b release-2.30.9 https://github.com/libsdl-org/SDL android/app/jni/SDL
      - name: fonts
        run: python3 tools/embed_fonts.py android/app/jni/fonts.c
      - name: build
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk PS4_Recomp_Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: PS4_Recomp_Android, path: PS4_Recomp_Android.apk }

  linux:
    runs-on: ubuntu-22.04   # glibc 2.35: runs on SteamOS 3 and most current distributions
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0 libgl1
      - run: FREE=1 ./build_linux.sh
      - name: package
        run: |
          mkdir -p PS4_Recomp_Linux
          cp build/linux_free/PS4 PS4_Recomp_Linux/
          cp port/README_linux.txt PS4_Recomp_Linux/README.txt
          tar czf PS4_Recomp_Linux.tar.gz PS4_Recomp_Linux
      - uses: actions/upload-artifact@v4
        with: { name: PS4_Recomp_Linux, path: PS4_Recomp_Linux.tar.gz }

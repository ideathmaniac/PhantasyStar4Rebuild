# Publishes a release: the three free programs (interpreter only, nothing
# from the game inside) with the notes from release_notes/v<version>.md.
# Run it by hand: Actions -> release -> Run workflow, version e.g. 0.38.
name: release
on:
  workflow_dispatch:
    inputs:
      version: { description: 'Version without "v", e.g. 0.38', required: true }

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - run: FREE=1 ./build_win.sh
      - name: package
        run: |
          mkdir -p PS4_Recomp && cp build/win_free/PS4.exe PS4_Recomp/ && cp win/README.txt PS4_Recomp/
          zip -r PS4_Recomp_Windows.zip PS4_Recomp
      - uses: actions/upload-artifact@v6
        with: { name: windows, path: PS4_Recomp_Windows.zip }

  linux:
    runs-on: ubuntu-22.04   # glibc 2.35
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0 libgl1
      - run: FREE=1 ./build_linux.sh
      - name: package
        run: |
          mkdir -p PS4_Recomp_Linux && cp build/linux_free/PS4 PS4_Recomp_Linux/ && cp port/README_linux.txt PS4_Recomp_Linux/README.txt
          tar czf PS4_Recomp_Linux.tar.gz PS4_Recomp_Linux
      - uses: actions/upload-artifact@v6
        with: { name: linux, path: PS4_Recomp_Linux.tar.gz }

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: '8.9' }
      - run: git clone --depth 1 -b release-2.30.9 https://github.com/libsdl-org/SDL android/app/jni/SDL
      - run: python3 tools/embed_fonts.py android/app/jni/fonts.c
      - name: signing key
        env: { KS: '${{ secrets.ANDROID_KEYSTORE }}' }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > $RUNNER_TEMP/ps4.jks; echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/ps4.jks" >> $GITHUB_ENV; fi
      - name: build
        working-directory: android
        env: { ANDROID_KEY_PASSWORD: '${{ secrets.ANDROID_KEY_PASSWORD }}' }
        run: gradle --no-daemon assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk PS4_Recomp_Android.apk
      - uses: actions/upload-artifact@v6
        with: { name: android, path: PS4_Recomp_Android.apk }

  publish:
    needs: [windows, linux, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with: { path: dist, merge-multiple: true }
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ inputs.version }}
        run: |
          notes=release_notes/v$VER.md
          [ -f "$notes" ] || { echo "no $notes"; exit 1; }
          gh release create "v$VER" dist/* --target "$GITHUB_SHA" --title "v$VER — Windows, Linux / Steam Deck, Android" --notes-file "$notes" --latest
